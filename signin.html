
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="signin.css">
</head>
<body>

    <div class="container min-vh-100 min-vw-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4 my-4" style="width: 100%; max-width: 450px;">

            <h2 class="text-center mb-4">Create Account</h2>

            <form action="homepage.html" onsubmit="return uname();">

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullname" class="form-label">Full Name</label>
                    <span id="nerror" class="mx-3 text-danger  fw-semibold d-inline-block"></span>
                    <input type="text" class="form-control" id="fullname"
                        placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email"
                        placeholder="Enter your email" >
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                        placeholder="Create a password">
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password" class="form-control"
                        id="confirmPassword"
                        placeholder="Confirm your password" >
                </div>

                <!-- Terms and Conditions -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox"
                        id="terms">

                    <label class="form-check-label" for="terms">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Register
                </button>

                <p class="text-center mt-3 mb-0">
                    Already have an account?
                    <a href="login.html" class="text-decoration-none">Login</a>
                </p>

            </form>

        </div>

    </div>
<script src="./register.js"></script>
</body>
</html>
